<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Hospital Coordination System</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main Login Container -->
    <div class="login-container">

        <div class="login-card">

            <!-- Hospital Icon -->
            <div class="hospital-icon">
                <i class="bi bi-hospital"></i>
            </div>

            <!-- Project Name -->
            <h2>Smart Hospital</h2>

            <h5>Emergency & Patient Care</h5>

            <p class="login-subtitle">
                Coordination System
            </p>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Username -->
                <div class="mb-3 text-start">

                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="mb-3 text-start">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- Role -->
                <div class="mb-4 text-start">

                    <label for="role" class="form-label">
                        Login As
                    </label>

                    <select class="form-select" id="role" required>

                        <option value="">
                            Select Role
                        </option>

                        <option value="Admin">
                            Admin
                        </option>

                        <option value="Doctor">
                            Doctor
                        </option>

                        <option value="Nurse">
                            Nurse
                        </option>

                        <option value="Blood Bank Staff">
                            Blood Bank Staff
                        </option>

                    </select>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn btn-primary w-100 login-btn"
                >
                    <i class="bi bi-box-arrow-in-right"></i>
                    Login
                </button>

            </form>


            <!-- Demo Information -->
            <div class="demo-info">

                <strong>Prototype Demo</strong>

                <p>
                    Username: admin
                    <br>
                    Password: admin123
                </p>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        // Get the login form
        const loginForm = document.getElementById("loginForm");


        // When the user clicks Login
        loginForm.addEventListener("submit", function(event) {

            // Prevent page refresh
            event.preventDefault();


            // Get values from the form
            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const role =
                document.getElementById("role").value;


            // Demo login
            if (
                username === "admin" &&
                password === "admin123"
            ) {

                // Save logged-in user
                localStorage.setItem(
                    "loggedInUser",
                    username
                );

                // Save selected role
                localStorage.setItem(
                    "userRole",
                    role
                );


                // Open dashboard
                window.location.href = "dashboard.html";

            } else {

                alert(
                    "Invalid login!\n\n" +
                    "Username: admin\n" +
                    "Password: admin123"
                );

            }

        });

    </script>

</body>
</html>
